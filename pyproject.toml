[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-trading-bot"
version = "0.0.1"
description = "한국투자증권(KIS) 기반 국내·해외 주식 자동매매 봇 (long-only, plugin algorithms, multi-resolution)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Jaemnani" }]

# P0 core dependencies only. Heavy libs (pandas-ta, TA-Lib, vectorbt, backtrader,
# torch/transformers) are added in their respective phases to keep the scaffold light.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "greenlet>=3.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "typer>=0.12",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
trader = "short_trading_bot.app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["short_trading_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["short_trading_bot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["short_trading_bot"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
